services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BackendMarketplaceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: BackendMarketplace
      Jwt__Audience: BackendMarketplaceClient
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT:-5173}"
    volumes:
      - backend-uploads:/app/wwwroot/Uploads
    ports:
      - "${BACKEND_PORT:-5220}:8080"

  frontend:
    build:
      context: .
      dockerfile: Front-end/Dockerfile
      args:
        VITE_API_URL: "http://localhost:${BACKEND_PORT:-5220}/api"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mssql-data:
  backend-uploads:
